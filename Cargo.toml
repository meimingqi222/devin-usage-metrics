[package]
name = "devin-usage-metrics"
version = "0.2.11"
edition = "2021"

[dependencies]
gpui-app-host = { git = "https://github.com/meimingqi222/gpui-app-kit.git", rev = "4957641acea044994199a58f8022c4d9b3c920e7" }
gpui-app-widgets = { git = "https://github.com/meimingqi222/gpui-app-kit.git", rev = "4957641acea044994199a58f8022c4d9b3c920e7" }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-app-update-core = { git = "https://github.com/meimingqi222/gpui-app-kit.git", rev = "4957641acea044994199a58f8022c4d9b3c920e7" }
gpui-app-update-installer = { git = "https://github.com/meimingqi222/gpui-app-kit.git", rev = "4957641acea044994199a58f8022c4d9b3c920e7" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
chrono = "0.4"
dirs = "5"
rayon = "1"
sys-locale = "0.3"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
rfd = "0.17"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
zstd = "0.13"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
libc = "0.2"
toml_edit = "0.22"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
smol = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"

[build-dependencies]
winres = "0.1.12"
embed-resource = "3"

[package.metadata.bundle]
name = "Agent Usage Metrics"
identifier = "com.devin.usage-metrics"
icon = ["assets/icon.icns", "assets/icon.ico"]
category = "Developer Tool"
short_description = "Local coding-agent usage analytics dashboard"
long_description = "A native desktop app for tracking Devin, Claude Code, Codex, and Antigravity usage and sessions."

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
gpui = { git = "https://github.com/meimingqi222/gpui-app-kit.git", rev = "4957641acea044994199a58f8022c4d9b3c920e7" }
