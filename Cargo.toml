[package]
name = "devin-usage-metrics"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
rayon = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
winres = "0.1.12"

[package.metadata.bundle]
name = "Agent Usage Metrics"
identifier = "com.devin.usage-metrics"
icon = ["assets/icon.icns", "assets/icon.ico"]
category = "Developer Tool"
short_description = "Local coding-agent usage analytics dashboard"
long_description = "A native desktop app for tracking Devin, Amp, Claude Code, Codex, and Antigravity usage and sessions."

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
