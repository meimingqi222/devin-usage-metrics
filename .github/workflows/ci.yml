name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Go / MyGo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l main.go internal)"
      - name: Build native package and bundle SQLite runtime
        run: go tool mygo build -skip-dmg
      - name: Locate bundled SQLite for offline fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          library = next(p for p in Path('build').rglob('*mygo-sqlite3*') if p.is_file())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'MYGO_SQLITE_LIBRARY={library.resolve()}\n')
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify no cgo is needed
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  sync-server:
    name: Sync server race / vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
