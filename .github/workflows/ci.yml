name: CI

on:
  push:
    branches:
      - main
  pull_request:

# GPUI 的系统依赖在 Windows/macOS 上开箱即用，
# Linux 需要额外图形库；桌面 CI 覆盖 macOS 与 Windows。
jobs:
  check:
    name: fmt / clippy / test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/gpui-kit
        with:
          token: ${{ secrets.GPUI_APP_KIT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Check content boundary
        run: python ../gpui-app-kit/tools/check_content.py --forbid-call start_load --forbid-call start_tick --forbid-call switch_period src/tray.rs

      - name: Run tests
        run: cargo test

  sync-server:
    name: Sync server race / vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
          cache: false
      - name: Run race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
