name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: devin-usage-metrics-windows-x64.zip
            asset_path: devin-usage-metrics-windows-x64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: devin-usage-metrics-macos-arm64.zip
            asset_path: devin-usage-metrics-macos-arm64.zip
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: devin-usage-metrics-macos-x64.zip
            asset_path: devin-usage-metrics-macos-x64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Windows Release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          Compress-Archive -Path target/${{ matrix.target }}/release/devin-usage-metrics.exe, assets -DestinationPath ${{ matrix.asset_path }}

      - name: Build macOS Release & Bundle
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          if cargo install cargo-bundle --locked && cargo bundle --release --target ${{ matrix.target }}; then
            cd target/${{ matrix.target }}/release/bundle/osx
            zip -r ../../../../../${{ matrix.asset_path }} "Agent Usage Metrics.app"
            cd ../../../../..
          else
            echo "Bundle failed, falling back to standalone binary zip"
            cd target/${{ matrix.target }}/release
            zip -r ../../../${{ matrix.asset_path }} devin-usage-metrics
            cd ../../..
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
