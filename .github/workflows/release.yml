name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name for release
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            os: windows-latest
            directory: windows-amd64
            artifact: devin-usage-metrics-windows-x64.zip
          - target: darwin/arm64
            os: macos-latest
            directory: darwin-arm64
            artifact: devin-usage-metrics-macos-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          import json, os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Release tag must be a stable x.y.z or vx.y.z version')
          path = Path('mygo.json')
          config = json.loads(path.read_text())
          config['version'] = version
          path.write_text(json.dumps(config, indent=2) + '\n')
      - name: Build native app and its runtime resources
        run: go tool mygo build -platform ${{ matrix.target }} -skip-dmg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package release ZIP and checksum
        run: python scripts/package-release.py --target ${{ matrix.target }} --output .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
