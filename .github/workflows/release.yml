name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name for release
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            os: windows-latest
            directory: windows-amd64
            artifact: devin-usage-metrics-windows-x64.zip
          - target: darwin/arm64
            os: macos-latest
            directory: darwin-arm64
            artifact: devin-usage-metrics-macos-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set package version from release tag
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          import json, os, re
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Release tag must be a stable x.y.z or vx.y.z version')
          path = Path('mygo.json')
          config = json.loads(path.read_text())
          config['version'] = version
          path.write_text(json.dumps(config, indent=2) + '\n')
      - name: Build native app and its runtime resources
        run: go tool mygo build -platform ${{ matrix.target }} -skip-dmg
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SQLite is compiled in, so the exe is the whole app. Keep Rust's
          # file name: Rust's updater only replaces devin-usage-metrics.exe.
          Copy-Item -LiteralPath 'build/${{ matrix.directory }}/Agent Usage Metrics.exe' -Destination 'devin-usage-metrics.exe'
          Compress-Archive -Path 'devin-usage-metrics.exe' -DestinationPath '${{ matrix.artifact }}'
          $hash = (Get-FileHash '${{ matrix.artifact }}' -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding utf8 '${{ matrix.artifact }}.sha256'
      - name: Package signed macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 'build/${{ matrix.directory }}/Agent Usage Metrics.app'
          (cd 'build/${{ matrix.directory }}' && zip -r '../../${{ matrix.artifact }}' 'Agent Usage Metrics.app')
          shasum -a 256 '${{ matrix.artifact }}' > '${{ matrix.artifact }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
